name: Publish verified Smart Scroll v0.4.46
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v0446.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  publish-verified-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout verified compressed release parts
        uses: actions/checkout@v4

      - name: Restore and verify the original signed APK
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          import zlib
          directory=Path('dist/release-parts/v0.4.46')
          files=sorted(directory.glob('chunk[0-9][0-9][0-9].part'))
          assert [p.name for p in files] == [f'chunk{i:03d}.part' for i in range(22)], 'Release part sequence incomplete'
          compressed=b''.join(p.read_bytes() for p in files)
          assert len(compressed)==22659038, 'Compressed payload size mismatch'
          apk=zlib.decompress(compressed)
          assert len(apk)==53152717, 'Signed APK length mismatch'
          expected='9dd9238848a3f6e855a8885fa02bf4fcb80821891ea6442887fe4fd1fb9687e8'
          assert sha256(apk).hexdigest()==expected, 'Signed APK SHA-256 mismatch'
          Path('SmartScroll-v0.4.46.apk').write_bytes(apk)
          print('Verified exact v0.4.46 signed APK:', expected)
          PY

      - name: Upload exact signed APK to the existing draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view v0.4.46 -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create v0.4.46 -R "$GITHUB_REPOSITORY" --target main \
              --title 'Smart Scroll v0.4.46' --prerelease --draft \
              --notes 'アイボリー×シャンパンゴールドの小型操作パネル、開始・一時停止・再開、小さな完全停止ボタン。まず1台でお試しください。'
          fi
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v0.4.46" > "$RUNNER_TEMP/release-before.json"
          python3 - <<'PY'
          import json,os
          j=json.load(open(os.environ['RUNNER_TEMP']+'/release-before.json'))
          expected='sha256:9dd9238848a3f6e855a8885fa02bf4fcb80821891ea6442887fe4fd1fb9687e8'
          matches=[a for a in j['assets'] if a['name']=='SmartScroll-v0.4.46.apk']
          assert all(a.get('digest')==expected and a.get('size')==53152717 for a in matches), 'Unexpected existing APK, refusing overwrite'
          PY
          if ! gh release view v0.4.46 -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qx 'SmartScroll-v0.4.46.apk'; then
            gh release upload v0.4.46 SmartScroll-v0.4.46.apk -R "$GITHUB_REPOSITORY"
          fi

      - name: Verify uploaded asset, then publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v0.4.46" > "$RUNNER_TEMP/release-after.json"
          python3 - <<'PY'
          import json,os
          j=json.load(open(os.environ['RUNNER_TEMP']+'/release-after.json'))
          matches=[a for a in j['assets'] if a['name']=='SmartScroll-v0.4.46.apk' and a['state']=='uploaded']
          assert len(matches)==1, 'Exactly one uploaded APK required'
          assert matches[0]['size']==53152717, 'Asset size mismatch'
          assert matches[0].get('digest')=='sha256:9dd9238848a3f6e855a8885fa02bf4fcb80821891ea6442887fe4fd1fb9687e8', 'Asset digest mismatch'
          PY
          gh release download v0.4.46 -R "$GITHUB_REPOSITORY" \
            --pattern 'SmartScroll-v0.4.46.apk' --dir "$RUNNER_TEMP" --clobber
          printf '%s  %s\n' '9dd9238848a3f6e855a8885fa02bf4fcb80821891ea6442887fe4fd1fb9687e8' \
            "$RUNNER_TEMP/SmartScroll-v0.4.46.apk" | sha256sum --check -
          gh release edit v0.4.46 -R "$GITHUB_REPOSITORY" --draft=false --prerelease

      - name: Switch the permanent QR page only after successful verification
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          o={
            'schema':1,
            'versionCode':71,
            'versionName':'0.4.46',
            'apkUrl':'https://github.com/sui-0825/smart-scroll-apk/releases/download/v0.4.46/SmartScroll-v0.4.46.apk',
            'notes':'v0.4.46：アイボリーとシャンパンゴールドの小型操作パネルと完全停止ボタン。まず1台で動作確認してください。'
          }
          Path('latest.json').write_text(json.dumps(o, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          PY
          if ! git diff --quiet -- latest.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add latest.json
            git commit -m 'Switch permanent QR to verified Smart Scroll v0.4.46'
            git push origin HEAD:main
          fi

      - name: Deploy permanent QR page with the new APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run deploy-site.yml -R "$GITHUB_REPOSITORY" --ref main
