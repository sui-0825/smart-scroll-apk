name: Publish isolated Smart Scroll capture guard test APK
on:
  push:
    branches: [feature/capture-guard-public-test-20261031]
    paths:
      - .github/workflows/publish-capture-guard-test.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct and cryptographically verify test APK
        shell: bash
        run: |
          set -euo pipefail
          command -v zstd || (sudo apt-get update -qq && sudo apt-get install -y zstd)
          mkdir -p "$RUNNER_TEMP/test"
          BASE="$RUNNER_TEMP/test/base.apk"
          PATCH="$RUNNER_TEMP/test/patch.zst"
          APK="$RUNNER_TEMP/test/SmartScroll-capture-guard-test.apk"
          curl -fLsS --retry 3 "https://github.com/sui-0825/smart-scroll-apk/releases/download/v0.4.59/SmartScroll-v0.4.59.apk" -o "$BASE"
          echo "3c63e2cd479072ec96a567cffd7148638aa69faa4f22d4adc0a89fa6428128cf  $BASE" | sha256sum -c -
          shopt -s nullglob
          parts=(dist/capture-guard-test-patch-v0459/part-*.txt)
          test "${#parts[@]}" -eq 6
          cat "${parts[@]}" | base64 --decode > "$PATCH"
          test "$(stat -c%s "$PATCH")" -eq 2457529
          echo "b299f4346bd0667cc2f207f194dc19bd09b3541173e4f58f63b84cb5b1541d89  $PATCH" | sha256sum -c -
          zstd -d --patch-from="$BASE" "$PATCH" -o "$APK"
          test "$(stat -c%s "$APK")" -eq 53201873
          echo "68043efcc943e24c44c49df8b08eca0233db535f956b01332650fa2db3c47eb5  $APK" | sha256sum -c -
          AAPT="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -type f -name aapt | sort -V | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$AAPT" && test -x "$APKSIGNER"
          INFO="$("$AAPT" dump badging "$APK" | grep '^package: ')"
          echo "$INFO"
          [[ "$INFO" == *"name='com.smartscroll.app'"* ]]
          [[ "$INFO" == *"versionCode='84'"* ]]
          [[ "$INFO" == *"versionName='0.4.59'"* ]]
          "$APKSIGNER" verify "$APK"
          BASE_CERT="$("$APKSIGNER" verify --print-certs "$BASE" | grep -i 'certificate SHA-256 digest:' | head -n 1)"
          TEST_CERT="$("$APKSIGNER" verify --print-certs "$APK" | grep -i 'certificate SHA-256 digest:' | head -n 1)"
          test -n "$BASE_CERT" && test "$BASE_CERT" = "$TEST_CERT"
      - name: Publish distinct prerelease (never change main QR or update manifest)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="capture-guard-test-v0.4.59-20261031"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Already published; refusing overwrite.'
            exit 1
          fi
          gh release create "$TAG" "$RUNNER_TEMP/test/SmartScroll-capture-guard-test.apk" \
            -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title 'Smart Scroll v0.4.59 screenshot safety TEST ONLY' \
            --notes 'Screenshot callback safety test with ML Kit consent v2. Not the normal QR. No in-app update notice. One test phone only. Keep Google Play Protect enabled; do not override security warnings.'
          mkdir -p "$RUNNER_TEMP/test/recheck"
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" \
            -p SmartScroll-capture-guard-test.apk --dir "$RUNNER_TEMP/test/recheck" --clobber
          echo "68043efcc943e24c44c49df8b08eca0233db535f956b01332650fa2db3c47eb5  $RUNNER_TEMP/test/recheck/SmartScroll-capture-guard-test.apk" | sha256sum -c -
