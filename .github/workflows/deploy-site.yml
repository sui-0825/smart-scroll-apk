name: Deploy Smart Scroll APK download site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-site.yml
      - latest.json
      - index.html
      - SmartScroll-common-QR.png
      - SmartScroll-永久共通QRカード.svg
      - qr.html
      - build_qr_poster.py
  release:
    types: [published]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: smart-scroll-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout download page
        uses: actions/checkout@v4

      # Reassemble the exact tested, signed APK from Git blobs committed
      # to this public distribution repository. Never need to expose
      # the private source repository or its signing keystore.
      - name: Publish verified v0.4.27 signed APK release
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/SmartScroll-v0.4.27.apk"
          cat dist/release-parts/v0.4.27/*.part > "$APK"
          echo "8521188c39f3346ab704d8f58df9e29315a48df2af1c5e3496b6cc8fd24e174e  $APK" | sha256sum --check -
          test "$(stat -c%s "$APK")" -eq 5445009
          if ! gh release view v0.4.27 -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create v0.4.27 "$APK" -R "$GITHUB_REPOSITORY" \
              --target main --title "Smart Scroll v0.4.27" --prerelease \
              --notes "安定性を重視したSmart Scroll v0.4.27。スワイプ位置と速度のランダム化、ふわキラ流れ星、サイズのランダム演出、画面表示の整理に対応。初めに1台で試してください。"
          fi

      - name: Select and verify the approved release APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p site
          python3 - <<'PY'
          import json, re, pathlib
          data = json.loads(pathlib.Path('latest.json').read_text())
          v = data['versionName']
          expected = f'https://github.com/sui-0825/smart-scroll-apk/releases/download/v{v}/SmartScroll-v{v}.apk'
          assert re.fullmatch(r'\d+\.\d+\.\d+', v), 'bad version'
          assert data['schema'] == 1 and data['versionCode'] > 0 and data['apkUrl'] == expected, 'manifest must point to approved release'
          pathlib.Path('/tmp/smartscroll-tag.txt').write_text('v' + v)
          pathlib.Path('/tmp/smartscroll-asset.txt').write_text(f'SmartScroll-v{v}.apk')
          PY
          TAG="$(cat /tmp/smartscroll-tag.txt)"
          ASSET="$(cat /tmp/smartscroll-asset.txt)"
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" > "$RUNNER_TEMP/release.json"
          python3 - <<'PY'
          import json, os, pathlib
          release=json.load(open(os.environ['RUNNER_TEMP']+'/release.json'))
          assert not release['draft'], 'release not published'
          name=pathlib.Path('/tmp/smartscroll-asset.txt').read_text()
          matching=[a for a in release['assets'] if a['name']==name and a['state']=='uploaded']
          assert len(matching)==1 and matching[0]['size']>100000 and matching[0]['size']<100000000, 'missing or invalid APK'
          digest=matching[0].get('digest','')
          assert digest.startswith('sha256:') and len(digest)==71, 'missing SHA-256 hash'
          pathlib.Path('/tmp/smartscroll-hash.txt').write_text(digest[7:])
          PY
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" --pattern "$ASSET" --dir "$RUNNER_TEMP" --clobber
          printf '%s  %s\n' "$(cat /tmp/smartscroll-hash.txt)" "$RUNNER_TEMP/$ASSET" | sha256sum --check -
          cp "$RUNNER_TEMP/$ASSET" site/SmartScroll.apk
          cp latest.json site/latest.json
          cp SmartScroll-common-QR.png site/SmartScroll-common-QR.png
          cp 'SmartScroll-永久共通QRカード.svg' 'site/SmartScroll-永久共通QRカード.svg'
          cp qr.html site/qr.html
          python3 - <<'PY'
          import pathlib
          html=pathlib.Path('index.html').read_text()
          old='link.href = data.apkUrl;'
          assert old in html, 'download link expression not found'
          html=html.replace(old,'link.href = "./SmartScroll.apk";')
          html=html.replace('GitHubのダウンロード確認や', 'Androidのダウンロード確認や')
          pathlib.Path('site/index.html').write_text(html)
          pathlib.Path('site/.nojekyll').write_text('')
          PY

      - name: Generate downloadable PNG and JPG QR posters
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python3 -m pip install --disable-pip-version-check pillow 'qrcode[pil]'
          python3 build_qr_poster.py
          # Additional, separate test-only QR image: never replace the shared QR.
          python3 - <<'PY'
          from pathlib import Path
          import qrcode
          target = ("https://github.com/sui-0825/smart-scroll-apk/releases/download/"
                    "consent-screen-test-v0.4.59-20261031/SmartScroll-consent-screen-test.apk")
          image = qrcode.make(target).convert("RGB")
          image.save("site/SmartScroll-consent-test-QR.png")
          page = """<!doctype html>
          <html lang="ja"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Smart Scroll 同意画面テスト専用QR</title>
          <style>body{font-family:system-ui,sans-serif;max-width:480px;margin:auto;
          padding:18px;text-align:center;background:#faf8f4;color:#1c3351}
          img{width:100%;max-width:380px;background:white;border-radius:12px}
          a{display:block;margin:15px;padding:14px;background:#193b76;color:white;
          border-radius:12px;text-decoration:none;font-weight:bold}</style></head><body>
          <h1>Smart Scroll</h1><p>同意画面テスト版・1台用</p>
          <img alt="同意画面テスト版QR" src="./SmartScroll-consent-test-QR.png">
          <a href="./SmartScroll-consent-test-QR.png" download="SmartScroll-consent-test-QR.png">QR画像を保存する</a>
          <p>このリンクは通常の固定QRとは別です。一般配布・一括更新は行いません。</p>
          </body></html>"""
          Path("site/consent-test-qr.html").write_text(page, encoding="utf-8")
          # New standalone test QR; leave both the existing test and main QR untouched.
          v2_target = ("https://github.com/sui-0825/smart-scroll-apk/releases/download/"
                       "mlkit-disclosure-v2-test-v0.4.59-20261031/SmartScroll-mlkit-disclosure-v2-test.apk")
          qrcode.make(v2_target).convert("RGB").save("site/SmartScroll-mlkit-v2-test-QR.png")
          v2_page = page.replace("同意画面テスト版・1台用", "ML Kit説明追加版・テスト端末1台用")
          v2_page = v2_page.replace("SmartScroll-consent-test-QR.png", "SmartScroll-mlkit-v2-test-QR.png")
          Path("site/mlkit-v2-test-qr.html").write_text(v2_page, encoding="utf-8")
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload verified download website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
