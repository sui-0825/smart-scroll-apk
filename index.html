<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#152d57">
  <meta name="referrer" content="no-referrer">
  <title>Smart Scroll | 最新版APKダウンロード</title>
  <style>
    :root { font-family: system-ui, "Noto Sans JP", sans-serif; color: #172d52; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #f0f7ff; display: grid; place-items: center; padding: 22px; }
    main { width: 100%; max-width: 480px; border: 3px solid #193b76; border-radius: 25px; background: #fff; padding: 30px 22px 24px; box-shadow: 0 16px 38px #1b3d6d1c; text-align: center; }
    .star { font-size: 36px; color: #edb23c; }
    h1 { margin: 5px 0; font-size: clamp(28px, 8vw, 39px); line-height: 1.3; }
    h2 { margin: 10px 0 16px; font-size: 20px; }
    .pill { border-radius: 50px; background: #e7f2ff; display: inline-block; padding: 8px 18px; font-weight: 700; }
    .status { margin: 22px 0; min-height: 50px; line-height: 1.6; }
    a.download { display: block; background: #193b76; border-radius: 16px; color: #fff; font-size: 18px; font-weight: bold; padding: 15px 16px; margin: 18px 0; text-decoration: none; }
    a.download[hidden] { display: none; }
    p.note { color: #475569; font-size: 13px; line-height: 1.7; }
    .small { color: #5a6580; font-size: 12px; margin-top: 14px; }
  </style>
</head>
<body>
<main>
  <div class="star" aria-hidden="true">✦</div>
  <h1>Smart Scroll</h1>
  <h2>Android用・最新版APK</h2>
  <div class="pill" id="version">最新版を確認中</div>
  <p class="status" id="status" role="status" aria-live="polite">最新のインストールファイルを探しています…</p>
  <a class="download" id="download" hidden href="#">⬇ 最新版APKをダウンロード</a>
  <p class="note">AndroidではQRを開くとダウンロード先へ自動で進みます。始まらない場合は上のボタンを押してください。<br>AndroidやGoogle Play プロテクトによる安全確認は省略されません。ダウンロード完了後にAPKを開いてください。</p>
  <p class="small"><a href="https://github.com/sui-0825/smart-scroll-apk/releases">手動でリリース一覧を開く</a></p>
</main>
<script>
(async () => {
  const status = document.getElementById("status");
  const version = document.getElementById("version");
  const link = document.getElementById("download");
  const allowed = /^https:\/\/github\.com\/sui-0825\/smart-scroll-apk\/releases\/download\/[^/?#]+\/[^/?#]+\.apk$/;
  try {
    const response = await fetch("./latest.json?ts=" + Date.now(), { cache: "no-store" });
    if (!response.ok) throw new Error("manifest unavailable");
    const data = await response.json();
    if (data.schema !== 1 || !Number.isInteger(data.versionCode) || data.versionCode < 1 ||
        typeof data.versionName !== "string" || typeof data.apkUrl !== "string" ||
        !allowed.test(data.apkUrl)) {
      throw new Error("no valid release");
    }
    version.textContent = "最新版 Ver." + data.versionName;
    link.href = data.apkUrl;
    link.textContent = "⬇ APKをダウンロード";
    link.hidden = false;

    // Android: one QR scan can open the verified release download directly.
    // Keep the visible, ordinary link as a fallback for browsers that block
    // downloads started by page navigation. Do not click the link twice.
    if (/Android/i.test(navigator.userAgent)) {
      status.textContent = "最新版のダウンロード先を開いています。始まらなければ下のボタンを押してください。";
      let shouldOpen = true;
      try {
        const last = JSON.parse(sessionStorage.getItem("smartscroll-download-opened") || "null");
        if (last && last.code === data.versionCode &&
            Date.now() - last.at < 120000) shouldOpen = false;
        if (shouldOpen) sessionStorage.setItem("smartscroll-download-opened",
          JSON.stringify({ code: data.versionCode, at: Date.now() }));
      } catch (_) {
        // Privacy-restricted browsers may block session storage; link still works.
      }
      if (shouldOpen) {
        window.setTimeout(() => {
          if (document.visibilityState !== "hidden") window.location.assign(data.apkUrl);
        }, 300);
      } else {
        status.textContent = "先ほどダウンロード先を開きました。始まらなかった場合は下のボタンを押してください。";
      }
    } else {
      status.textContent = "下のボタンから最新版APKをダウンロードしてください。";
    }
  } catch (_) {
    version.textContent = "配布情報を確認できません";
    status.textContent = "少し待ってから読み直すか、リリース一覧からダウンロードしてください。";
  }
})();
</script>
</body>
</html>
